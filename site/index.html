<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>books</title>
        <style>
            header{
                background-color: rgb(255, 217, 147);
                color: #694002;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                border: 5px solid;
                

            }
           
          
            main{
                background-color: #FFFFFF;
                color: #694002;
                max-width: 800px;
                margin: 0 auto;
                display: flex;


            }
            img{
                width: 130px;
                height: 200px;

            }
             .livro1{
              font-weight: bold;
             }
             
        </style>
        
    </head>

    <body>
        <header>
            <h1>Reading book</h1>
            <p>Bem-vindos, aqui você pode encontrar resenhas e opiniões das pessoas sobre livros</p>
            <p>ENJOY!</p>
            
        
        </header>

        
      
        <main>
           <div>
          
          <h2>Alguns livros...</h2>

          </div>
        
            <img src="ascronicasdenarnia.jpg" alt="Capa do livro As Crônicas de Nárnia de C. S. Lewis, edição de Volume Único. A imagem destaca o rosto em close-up de um leão majestoso, Aslan, com uma juba imponente feita de chamas estilizadas em tons de dourado, laranja e vermelho. O leão possui olhos azuis claros e expressivos. No topo da capa, o título As Crônicas de NÁRNIA está escrito em letras douradas, seguido pelo nome do autor C. S. LEWIS em branco e a etiqueta Volume Único logo abaixo. O fundo é escuro com arabescos sutis.">
        
        <div>
        
          <p class="livro1">
            As crônicas de nárnia</p>
          <button>❤️<span>0</span></button>
          
        </div>


       
        </main>
    
</body>
<script>
  const botao = document.querySelector("button");
  botao.addEventListener("click", botaoClicado);

  function botaoClicado(){
    console.log("fui clicado");
    let texto = botao.querySelector("span");
    texto.textContent++;
  }

  
</script>

</html>
